[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constellaration-uq"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
# Files on the Lightning studio carry the execute bit by default, which is a
# filesystem artifact rather than intent, so the missing-shebang rule is noise.
ignore = ["EXE002"]

[tool.ruff.format]
quote-style = "single"
# Code blocks in the decision log and CLAUDE.md are verbatim quotes of
# Proxima's published source. Reformatting them, including restyling their
# double quotes to single, would make the quotation inaccurate, and the point
# of those blocks is that they are what their repo actually says.
exclude = ["*.md"]
